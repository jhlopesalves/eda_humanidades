website:
  title: "Estatística Descritiva e Inferencial em Python para Humanidades"
  description: "Notas de aula e notebooks de programação, análise de dados e estatística em Python para as humanidades."
  site-url: https://jhlopesalves.github.io/eda_humanidades/
  repo-url: https://github.com/jhlopesalves/eda_humanidades
  repo-branch: main
  search: true
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: "[Sobre o curso](/about.qmd)"
    right: "[Dados e proveniência](/DATASETS.md) · [Licença MIT](https://github.com/jhlopesalves/eda_humanidades/blob/main/LICENSE)"
  sidebar:
    title: "Estatística em Python"
    style: docked
    tools:
      - icon: github
        href: https://github.com/jhlopesalves/eda_humanidades
        aria-label: GitHub
    contents:
      - href: index.qmd
        text: Início
      - section: Módulo 1
        contents:
          - href: encontro_1/enc_1.ipynb
            text: "1 - Primeiros passos"
          - href: encontro_2/enc_2.ipynb
            text: "2 - Fundamentos de Python"
          - href: encontro_3/enc_3.ipynb
            text: "3 - Funções e métricas lexicais"
          - href: encontro_4/enc_4.ipynb
            text: "4 - NumPy e pandas"
          - href: encontro_5/datasaurus.ipynb
            text: "Interlúdio: Datasaurus Dozen"
          - href: encontro_5/enc_5.ipynb
            text: "5 - Estatística descritiva"
          - href: encontro_6/enc_6.ipynb
            text: "6 - Forma e dispersão"
      - section: Módulo 2
        contents:
          - href: encontro_7/enc_7.ipynb
            text: "7 - Relações entre variáveis"
          - href: encontro_8/enc_8.ipynb
            text: "8 - Correlação e associação"
          - href: encontro_8/enc_8-parte2.ipynb
            text: "8, parte 2 - Visualização"
          - href: encontro_9/enc_9.ipynb
            text: "9 - Distribuição normal"
          - href: encontro_10/enc_10.ipynb
            text: "10 - Amostragem e incerteza"
      - href: DATASETS.md
        text: Dados e proveniência
      - href: about.qmd
        text: Sobre o curso

execute:
  enabled: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/css/site.css
    fontsize: 18px
    linestretch: 1.6
    grid:
      sidebar-width: 250px
      body-width: 760px
      margin-width: 220px
    toc: true
    code-copy: true
    code-overflow: wrap
    respect-user-color-scheme: true
    smooth-scroll: false

lang: pt-BR
