name: Validar notebooks

on:
  push:
  pull_request:

jobs:
  estrutura-e-sintaxe:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar JSON, metadados e sintaxe
        run: python scripts/validate_notebooks.py
