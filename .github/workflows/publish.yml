name: Publicar site Quarto no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Instalar o Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar o site
        run: quarto render

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
